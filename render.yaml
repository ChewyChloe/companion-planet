services:
  - type: web
    name: companion-planet
    runtime: node
    buildCommand: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: WEB_ORIGINS
        sync: false
